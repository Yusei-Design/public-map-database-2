<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Public Map</title>

  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- App CSS -->
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="map"></div>

  <div class="filter-bar">
    <div id="categoryFilter" class="filter-chips"></div>
  </div>

  <div class="count-bar" id="countBar">
    <div class="count-number" id="visibleCount">0</div>
    <div class="count-label">記録数</div>
  </div>

  <button class="fab-btn" id="fabBtn" title="新規投稿">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19" />
      <line x1="5" y1="12" x2="19" y2="12" />
    </svg>
  </button>

  <div class="info-panel" id="infoPanel">
    <button class="close-btn" onclick="closePanel()">×</button>
    <div id="panelContent"></div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" src="" alt="拡大画像" />
  </div>

  <!-- App JS -->
  <script src="./app.js" defer></script>
</body>
</html>
