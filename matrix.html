<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Public Map Database - Matrix View</title>

  <link rel="stylesheet" href="style.css" />

  <style>
    /* --- Matrix View Specific Styles --- */
    body {
      background-color: var(--bg-base);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .matrix-container {
      flex: 1;
      display: grid;
      /* 縦軸ラベルエリア + 4つのカテゴリー */
      grid-template-columns: 80px repeat(4, 1fr);
      /* 横軸ラベルエリア + 3つの公共性レベル */
      grid-template-rows: 60px repeat(3, 1fr);
      gap: 2px;
      padding: 20px;
      height: 100%;
      box-sizing: border-box;
      overflow: auto; /* 小さい画面ではスクロール */
      min-width: 800px; /* 横幅確保 */
    }

    /* Headers */
    .header-col, .header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--text-sub);
      font-size: 14px;
    }

    .header-col {
      border-bottom: 2px solid #ddd;
    }

    .header-row {
      border-right: 2px solid #ddd;
      writing-mode: vertical-rl; /* 縦書き */
      transform: rotate(180deg); /* 向き調整 */
    }

    /* The Cell */
    .matrix-cell {
      background: rgba(255, 255, 255, 0.5);
      border: 1px dashed #e0e0e0;
      border-radius: 8px;
      position: relative; /* ピンを絶対配置するため */
      transition: background 0.2s;
    }

    .matrix-cell:hover {
      background: rgba(255, 255, 255, 0.8);
      border-color: #bdbdbd;
    }

    /* ピンの位置調整用 */
    .scatter-pin {
      position: absolute;
      transform: translate(-50%, -50%); /* 中心基準 */
      z-index: 10;
    }
    
    /* マップ用のスタイルを上書きして使いやすく */
    .scatter-pin .marker-wrap {
      /* マップ用のカーソルポインターなどを継承 */
    }

    /* Empty state */
    .loading-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--text-sub);
      font-weight: 700;
    }
  </style>
</head>

<body>

  <div id="loading" class="loading-msg">Loading Data...</div>

  <div class="matrix-container" id="matrixGrid" style="opacity: 0; transition: opacity 0.5s;">
    <div></div>

    <div class="header-col">おもてなし</div>
    <div class="header-col">黙認・境界</div>
    <div class="header-col">転用</div>
    <div class="header-col">侵入</div>

    <div class="header-row">プラスな面</div>
    <div class="matrix-cell" id="cell-0-0" data-cat="おもてなし" data-pub="plus"></div>
    <div class="matrix-cell" id="cell-1-0" data-cat="黙認・境界" data-pub="plus"></div>
    <div class="matrix-cell" id="cell-2-0" data-cat="転用" data-pub="plus"></div>
    <div class="matrix-cell" id="cell-3-0" data-cat="侵入" data-pub="plus"></div>

    <div class="header-row">中立的</div>
    <div class="matrix-cell" id="cell-0-1" data-cat="おもてなし" data-pub="neutral"></div>
    <div class="matrix-cell" id="cell-1-1" data-cat="黙認・境界" data-pub="neutral"></div>
    <div class="matrix-cell" id="cell-2-1" data-cat="転用" data-pub="neutral"></div>
    <div class="matrix-cell" id="cell-3-1" data-cat="侵入" data-pub="neutral"></div>

    <div class="header-row">マイナスな面</div>
    <div class="matrix-cell" id="cell-0-2" data-cat="おもてなし" data-pub="minus"></div>
    <div class="matrix-cell" id="cell-1-2" data-cat="黙認・境界" data-pub="minus"></div>
    <div class="matrix-cell" id="cell-2-2" data-cat="転用" data-pub="minus"></div>
    <div class="matrix-cell" id="cell-3-2" data-cat="侵入" data-pub="minus"></div>
  </div>

  <div id="infoPanel" class="info-panel">
    <button class="close-btn" id="panelCloseBtn">×</button>
    <div id="panelContent" class="panel-scroll-container"></div>
  </div>

  <div id="lightbox" class="lightbox-overlay">
    <button class="lightbox-close" id="lightboxCloseBtn">×</button>
    <img id="lightboxImg" class="lightbox-img" src="" alt="" />
  </div>

  <script src="matrix.js"></script>
</body>
</html>
